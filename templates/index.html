        // --------
    // Timeline

    // Helper functions to simulate BLE send, read, and stop_read actions
    function bleSend(device, data) {
      console.log(`Sending data to ${device}: ${data}`);
    }

    function bleRead(device, format) {
      console.log(`Reading data from ${device} with format: ${format}`);
    }

    function bleStopRead(device, format) {
      console.log(`Stop reading data from ${device} with format: ${format}`);
    }

    // Main function to trigger actions based on timeline JSON
    function triggerActions(timelineJson) {
      timelineJson.forEach((entry) => {
        const device = entry.name;

        entry.actions.forEach((action) => {
          const start_time = parseTime(action.start_time);
          const end_time = parseTime(action.end_time);

          if (action.methods.hasOwnProperty('write')) {
            const start_data = action.methods.write.start_data;
            const stop_data = action.methods.write.stop_data;

            // Trigger bleSend at start_time with start_data
            setTimeout(() => {
              bleSend(device, start_data);
            }, start_time);

            // Trigger bleSend at end_time with stop_data
            setTimeout(() => {
              bleSend(device, stop_data);
            }, end_time);
          }

          if (action.methods.hasOwnProperty('read')) {
            const format = action.methods.read.format;

            // Trigger bleRead at start_time with format
            setTimeout(() => {
              bleRead(device, format);
            }, start_time);

            // Trigger bleStopRead at end_time with format
            setTimeout(() => {
              bleStopRead(device, format);
            }, end_time);
          }
        });
      });
    }

    // Helper function to parse time in mm:ss format and return milliseconds
    function parseTime(timeStr) {
      const [minutes, seconds] = timeStr.split(':').map(Number);
      return minutes * 60 * 1000 + seconds * 1000;
    }

    // -------------------
    // Bluetooth
    let terminalContainer = document.getElementById('terminal');
    let devices = [];

    function connect(deviceName) {
      let existingDevice = devices.find(device => device.name === deviceName);

      if (existingDevice) {
        log('Selecting a new Bluetooth device for "' + deviceName + '"...');
        return requestBluetoothDevice().then(device => {
          existingDevice.device = device;
          return connectDeviceAndCacheCharacteristic(device).then(characteristic =>
            startNotifications(deviceName, characteristic)
          );
        });
      }

      return requestBluetoothDevice().then(device => {
        devices.push({ name: deviceName, device: device });
        return connectDeviceAndCacheCharacteristic(device).then(characteristic =>
          startNotifications(deviceName, characteristic)
        );
      });
    }


    function requestBluetoothDevice() {
      log('Requesting bluetooth device...');

      return navigator.bluetooth
        .requestDevice({
          filters: [{ services: [0xFFE0] }],
        })
        .then(device => {
          log('"' + device.name + '" bluetooth device selected');
          deviceCache = device;

          // Added line
          deviceCache.addEventListener('gattserverdisconnected', handleDisconnection);

          return deviceCache;
        });
    }

    function handleDisconnection(event) {
      let device = event.target;

      log(
        '"' + device.name + '" bluetooth device disconnected, trying to reconnect...'
      );

      connectDeviceAndCacheCharacteristic(device)
        .then(characteristic => startNotifications(characteristic))
        .catch(error => log(error));
    }

    let characteristicCache = null;

    function connectDeviceAndCacheCharacteristic(device) {
      let deviceEntry = devices.find(dev => dev.device === device);

      if (deviceEntry && deviceEntry.characteristic) {
        return Promise.resolve(deviceEntry.characteristic);
      }

      log('Connecting to GATT server...');

      return device.gatt
        .connect()
        .then(server => {
          log('GATT server connected, getting service...');
          return server.getPrimaryService(0xFFE0);
        })
        .then(service => {
          log('Service found, getting characteristic...');
          return service.getCharacteristic(0xFFE1);
        })
        .then(characteristic => {
          log('Characteristic found');
          characteristicCache = characteristic;
          deviceEntry.characteristic = characteristic;
          return characteristicCache;
        });
    }

    function startNotifications(deviceName, characteristic) {
      let device = devices.find(dev => dev.name === deviceName);

      if (!device) {
        log('Device with name "' + deviceName + '" not found.');
        return;
      }

      log('Starting notifications for device "' + deviceName + '"...');

      return characteristic
        .startNotifications()
        .then(() => {
          log('Notifications started for device "' + deviceName + '"');
          characteristic.addEventListener(
            'characteristicvaluechanged',
            handleCharacteristicValueChanged.bind(null, deviceName)
          );
        })
        .catch(error => log(error));
    }

    function log(data, type = '') {
      terminalContainer.insertAdjacentHTML(
        'beforeend',
        '<div' + (type ? ' class="' + type + '"' : '') + '>' + data + '</div>'
      );
    }

    function disconnect(deviceName) {
      let device = devices.find(device => device.name === deviceName);

      if (!device) {
        log('Device with name "' + deviceName + '" not found.');
        return;
      }

      let characteristic = device.characteristic;
      if (!characteristic) {
        log('No characteristic found for device "' + deviceName + '".');
        return;
      }

      if (characteristic.gatt.connected) {
        characteristic.gatt.disconnect();
        log('"' + deviceName + '" bluetooth device disconnected');
      } else {
        log('"' + deviceName + '" bluetooth device is already disconnected');
      }

      // Remove the characteristic reference
      device.characteristic = null;
    }

    function handleCharacteristicValueChanged(deviceName, event) {
      let device = devices.find(device => device.name === deviceName);

      if (!device) {
        log('Device with name "' + deviceName + '" not found.');
        return;
      }
      let value = new TextDecoder().decode(event.target.value);
      let screen = screensArray.find(screen => screen.display === displayValue) || null;

      writeToScreen(value, screen)
      log(value, 'in');
    }

    function send(deviceName, data) {
      let device = devices.find(device => device.name === deviceName);

      if (!device) {
        log('Device with name "' + deviceName + '" not found.');
        return;
      }

      data = String(data);

      if (!data || !device.characteristic) {
        log('No data or characteristic found for device "' + deviceName + '".');
        return;
      }

      writeToCharacteristic(device.characteristic, data);
      log(data, 'out');
    }

    function writeToCharacteristic(characteristic, data) {
      characteristic.writeValue(new TextEncoder().encode(data));
    }

    // ------------------------
    // Graph
    var lastDate = 0;
    var data = []
    var TICKINTERVAL = 86400000
    let XAXISRANGE = 777600000
    function getDayWiseTimeSeries(baseval, count, yrange) {
        var i = 0;
        while (i < count) {
            var x = baseval;
            var y = Math.floor(Math.random() * (yrange.max - yrange.min + 1)) + yrange.min;

            data.push({
            x, y
            });
            lastDate = baseval
            baseval += TICKINTERVAL;
            i++;
        }
    }

    getDayWiseTimeSeries(new Date('11 Feb 2017 GMT').getTime(), 10, {
        min: 10,
        max: 90
    })

    function getNewSeries(baseval, yrange) {
        var newDate = baseval + TICKINTERVAL;
        lastDate = newDate

        for(var i = 0; i< data.length - 10; i++) {
            // IMPORTANT
            // we reset the x and y of the data which is out of drawing area
            // to prevent memory leaks
            data[i].x = newDate - XAXISRANGE - TICKINTERVAL
            data[i].y = 0
        }

        data.push({
            x: newDate,
            y: Math.floor(Math.random() * (yrange.max - yrange.min + 1)) + yrange.min
        })
    }

    function resetData(){
        // Alternatively, you can also reset the data at certain intervals to prevent creating a huge series 
        data = data.slice(data.length - 10, data.length);
    }



    var options = {

            data: data.slice()
        }],
