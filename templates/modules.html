{%block title%}
<link href="{{url_for('static',filename='css/custom_modules.css')}}" rel="stylesheet">
{%endblock%}

{% extends "base.html" %}
{% block content %}
<div class="module-box mx-auto max-w-7xl sm:px-6 lg:px-8 grid-container">
  <button type="button" onclick="showCreateModuleOverlay()" class="inline-flex items-center gap-x-2 rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Create module
  </button>

  <ul role="list" class="modules-grid grid grid-cols-1 gap-x-6 gap-y-8 lg:grid-cols-3 xl:gap-x-8">
    {% for module in context.modules %}
    <li class="overflow-hidden rounded-xl border border-gray-200" style="position: relative;"  onclick="showEditModuleOverlay('{{module.name}}')">
      <div class="flex items-center gap-x-4 border-b border-gray-900/5 bg-gray-50 p-6">
        <div class="text-sm font-medium leading-6 text-gray-900">{{module.name}}</div>
      </div>

      <a href="/delete_module?name={{module.name | urlencode}}" style="position: absolute; right: 1.5rem; top: 1.5rem; z-index: 10;" id="delete-button-{{functionCount}}"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </a>

      <dl class="-my-3 divide-y divide-gray-100 px-6 py-4 text-sm leading-6">
        <div class="flex justify-between gap-x-4 py-3">
          <dt class="text-gray-500">Created on</dt>
          <dd class="text-gray-700"><time datetime="2022-12-13">{{module.created_at}}</time></dd>
        </div>
        <div class="flex justify-between gap-x-4 py-3">
          <dt class="text-gray-500">Functions</dt>
          <dd class="flex items-start gap-x-2">
            <div class="font-medium text-gray-900">{% for function in module.functions %}{{function.name}} {% endfor %}</div>
          </dd>
        </div>
      </dl>
    </li>
    {% endfor %}


  </ul>

</div>


<script>
    function showCreateModuleOverlay(){
        console.log('show create module overlay')
        fetch('/create_module_overlay')
        .then(response => response.text())
        .then(data => {
        // Append the overlay content to the body
        document.body.insertAdjacentHTML('beforeend', data);
        })
        .catch(error => console.error('Error fetching overlay content:', error));
    }

    function addFunction() {
      console.log('add function');
      // Find the current function count
      const functionContainers = document.getElementsByClassName('function-name');
      let functionCount = functionContainers.length + 1;

      fetch(`/create_module_add_function?count=${functionCount}`)
          .then(response => response.text())
          .then(data => {

              // Append the overlay content to the body
              document.getElementById('functions').insertAdjacentHTML('beforeend', data);
          })
          .catch(error => console.error('Error fetching overlay content:', error));
    }

    function deleteFunction(i){

      document.getElementById(`wrapper-name-${i}`).remove()
      document.getElementById(`wrapper-method-${i}`).remove()
      document.getElementById(`wrapper-variables-${i}`).remove()
      document.getElementById(`wrapper-delete-button-${i}`).remove()
      exists = true
      while(exists){
        i = parseInt(i)+1;

        try{
          document.getElementById(`name-${i}`).name = `name-${i-1}`
          document.getElementById(`method-${i}`).name = `method-${i-1}`
          document.getElementById(`variables-${i}`).name = `variables-${i-1}`

          document.getElementById(`wrapper-name-${i}`).id = `wrapper-name-${i-1}`
          document.getElementById(`wrapper-method-${i}`).id = `wrapper-method-${i-1}`
          document.getElementById(`wrapper-variables-${i}`).id = `wrapper-variables-${i-1}`
          document.getElementById(`wrapper-delete-button-${i}`).id = `wrapper-delete-button-${i-1}`
          document.getElementById(`name-${i}`).id = `name-${i-1}`
          document.getElementById(`method-${i}`).id = `method-${i-1}`
          document.getElementById(`variables-${i}`).id = `variables-${i-1}`
          document.getElementById(`label-name-${i}`).id = `label-name-${i-1}`
          document.getElementById(`label-method-${i}`).id = `label-method-${i-1}`
          document.getElementById(`label-variables-${i}`).id = `label-variables-${i-1}`
        }
        catch{
          exists = false
        }
      }
    }

    function hideCreateModuleOverlay(){
        document.getElementById("module-overlay-create").remove()
    }


    function showEditModuleOverlay(module){
        console.log('show edit module overlay')
        fetch(`/edit_module_overlay?module=${module}`)
        .then(response => response.text())
        .then(data => {
        // Append the overlay content to the body
        document.body.insertAdjacentHTML('beforeend', data);
        })
        .catch(error => console.error('Error fetching overlay content:', error));
    }

    function deleteModule(module){
        console.log('delete module')
        fetch(`/delete_module?module=${module}`)
        .catch(error => console.error('Error fetching:', error));
    }
</script>

{%endblock%}
