{%block title%}
<link href="{{url_for('static',filename='css/custom_modules.css')}}" rel="stylesheet">
{%endblock%}

{% extends "base.html" %}
{% block content %}
<div class="module-box mx-auto max-w-7xl sm:px-6 lg:px-8 grid-container">
  <button type="button" onclick="window.location.href='/application?id=new'" class="inline-flex items-center gap-x-2 rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    
    Create application
  </button>

  <ul role="list" class="modules-grid grid grid-cols-1 gap-x-6 gap-y-8 lg:grid-cols-3 xl:gap-x-8">
    {% for application in context.applications %}
    <li class="overflow-hidden rounded-xl border border-gray-200" style="position: relative;"  onclick="window.location.href='/application?id={{application.id}}'">
      <div class="flex items-center gap-x-4 border-b border-gray-900/5 bg-gray-50 p-6">
        <div class="text-sm font-medium leading-6 text-gray-900">{{application.name}}</div>
      </div>

      <a href="/delete_application?name={{application.name}}" style="position: absolute; right: 1.5rem; top: 1.5rem; z-index: 10;" id="delete-button-{{functionCount}}"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </a>

      <dl class="-my-3 divide-y divide-gray-100 px-6 py-4 text-sm leading-6">
        <div class="flex justify-between gap-x-4 py-3">
          <dt class="text-gray-500">Created on</dt>
          <dd class="text-gray-700"><time datetime="2022-12-13">{{application.created_at}}</time></dd>
        </div>
        <div class="flex justify-between gap-x-4 py-3">
          <dt class="text-gray-500">Description</dt>
          <dd class="flex items-start gap-x-2">
            <div class="font-medium text-gray-900">-</div>
          </dd>
        </div>
      </dl>
    </li>
    {% endfor %}


  </ul>

</div>


<script>
</script>

{%endblock%}
