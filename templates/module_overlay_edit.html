<div class="relative z-10" id="module-overlay-create" role="dialog" aria-modal="true" >
    <!--
      Background backdrop, show/hide based on modal state.
  
      Entering: "ease-out duration-300"
        From: "opacity-0"
        To: "opacity-100"
      Leaving: "ease-in duration-200"
        From: "opacity-100"
        To: "opacity-0"
    -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-25 transition-opacity" onclick="hideCreateModuleOverlay()"></div>
  
    <div class="fixed inset-0 z-10 overflow-y-auto p-4 sm:p-6 md:p-20">
      <!--
        Command palette, show/hide based on modal state.
  
        Entering: "ease-out duration-300"
          From: "opacity-0 scale-95"
          To: "opacity-100 scale-100"
        Leaving: "ease-in duration-200"
          From: "opacity-100 scale-100"
          To: "opacity-0 scale-95"
      -->
      <div class="module-form-wrapper overflow-scroll rounded-xl bg-white shadow-2xl ring-1 ring-black ring-opacity-5 transition-all">
  
        <form action="/save_module" method="post">
          <div class="module-form-inner-wraper space-y-4">
            <div class="border-b border-gray-900/10 pb-8">
              <h2 class="text-base font-semibold leading-7 text-gray-900">Edit module</h2>
        
              <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                <div class="sm:col-span-4">
                  <label for="username" class="block text-sm font-medium leading-6 text-gray-900">Module name</label>
                  <div class="mt-2">
                    <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-indigo-600 sm:max-w-md">
                      <input type="text" name="name" id="module-name" value="{{module.name}}" class="block flex-1 border-0 bg-transparent py-1.5 pl-1 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-6">
                    </div>
                  </div>
                </div>
              </div>
            </div>
        
            <div class="border-b border-gray-900/10 pb-6">

              <h2 class="text-base font-semibold leading-7 text-gray-900">Functions</h2>
              <p class="mt-1 text-sm leading-6 text-gray-600">Define the capabilites of the module</p>
        
              <div id="functions" class="mt-4 grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">
                {% for function in module.functions %}
                  <div class="sm:col-span-2" id="wrapper-name-{{loop.index}}">
                    <label for="name-{{loop.index}}" id="label-name-{{loop.index}}" class="block text-sm font-medium leading-6 text-gray-900">Name</label>
                    <div class="mt-2">
                      <input type="text" name="name-{{loop.index}}" id="name-{{loop.index}}" value="{{function.name}}" placeholder="Your name for this function" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 variables">
                    </div>
                  </div>

                  <div class="sm:col-span-1" id="wrapper-method-{{loop.index}}">
                    <label for="method-{{loop.index}}" id="label-method-{{loop.index}}" class="block text-sm font-medium leading-6 text-gray-900">Method (Read/Write)</label>
                    <div class="mt-2">
                      <select id="method-{{loop.index}}" name="method-{{loop.index}}" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 placeholder:text-sm focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
                        <option {%if function.method == "Read"%}selected{%endif%}>Read</option>
                        <option {%if function.method == "Write"%}selected{%endif%}>Write</option>
                      </select>
                    </div>
                  </div>
          
                  <div class="sm:col-span-2" id="wrapper-variables-{{loop.index}}">
                    <label for="variables-{{loop.index}}" id="label-variables-{{loop.index}}" class="block text-sm font-medium leading-6 text-gray-900">Variables (seperated by spaces)</label>
                    <div class="mt-2">
                      <input type="text" name="variables-{{loop.index}}" id="variables-{{loop.index}}" value="{%for variable in function.variables%}{{variable.name}} {%endfor%}" placeholder="Variable1,Variable2,Variable3" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 variables">
                    </div>
                  </div>
                  
                  <div class="sm:col-span-1" id="wrapper-delete-button-{{loop.index}}">
                    <button type="button" onclick="deleteFunction('{{loop.index}}')" id="delete-button-{{loop.index}}" style="margin-top: 2.1rem"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    </button>
                  </div>
                {% endfor %}
              </div>
              <button type="button" onclick="addFunction()" class="add-function rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:ring-gray-400">Add function</button>
            </div>

          </div>
        
          <div class="module-form-buttons mt-6 flex items-center justify-end gap-x-6">
            <button type="button" onclick="hideCreateModuleOverlay()" class="text-sm font-semibold leading-6 text-gray-900">Cancel</button>
            <button type="submit" onclick="saveModule()" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Save</button>
          </div>
        </form>
  

      </div>
    </div>
  </div>
