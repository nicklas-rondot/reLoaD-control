<div class="relative z-10" id="module-overlay-create" role="dialog" aria-modal="true" >
    <!--
      Background backdrop, show/hide based on modal state.
  
      Entering: "ease-out duration-300"
        From: "opacity-0"
        To: "opacity-100"
      Leaving: "ease-in duration-200"
        From: "opacity-100"
        To: "opacity-0"
    -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-25 transition-opacity" onclick="hideCreateModuleOverlay()"></div>
  
    <div class="fixed inset-0 z-10 overflow-y-auto p-4 sm:p-6 md:p-20">
      <!--
        Command palette, show/hide based on modal state.
  
        Entering: "ease-out duration-300"
          From: "opacity-0 scale-95"
          To: "opacity-100 scale-100"
        Leaving: "ease-in duration-200"
          From: "opacity-100 scale-100"
          To: "opacity-0 scale-95"
      -->
      <div class="module-form-wrapper overflow-scroll rounded-xl bg-white shadow-2xl ring-1 ring-black ring-opacity-5 transition-all">
  
        <form action="/create_module" method="post">
          <div class="module-form-inner-wraper space-y-4">
            <div class="border-b border-gray-900/10 pb-8">
              <h2 class="text-base font-semibold leading-7 text-gray-900">Create a module</h2>
        
              <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                <div class="sm:col-span-4">
                  <label for="username" class="block text-sm font-medium leading-6 text-gray-900">Module name</label>
                  <div class="mt-2">
                    <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-indigo-600 sm:max-w-md">
                      <input type="text" name="name" id="module-name" class="block flex-1 border-0 bg-transparent py-1.5 pl-1 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-6">
                    </div>
                  </div>
                </div>
              </div>
            </div>
        
            <div class="border-b border-gray-900/10 pb-6">

              <h2 class="text-base font-semibold leading-7 text-gray-900">Functions</h2>
              <p class="mt-1 text-sm leading-6 text-gray-600">Define the capabilites of the module</p>
        
              <div id="functions" class="mt-4 grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">
                <div class="sm:col-span-2">
                  <label for="variables-1" class="block text-sm font-medium leading-6 text-gray-900">Name</label>
                  <div class="mt-2">
                    <input type="text" name="name-1" id="name-1" placeholder="Your name for this function" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 variables">
                  </div>
                </div>

                <div class="sm:col-span-2">
                  <label for="method-1" class="block text-sm font-medium leading-6 text-gray-900">Method (Read/Write)</label>
                  <div class="mt-2">
                    <select id="method-1" name="method-1" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 placeholder:text-sm focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
                      <option>Read</option>
                      <option>Write</option>
                    </select>
                  </div>
                </div>
        
                <div class="sm:col-span-2">
                  <label for="variables-1" class="block text-sm font-medium leading-6 text-gray-900">Variables (comma seperated, no spaces)</label>
                  <div class="mt-2">
                    <input type="text" name="variables-1" id="variables-1" placeholder="Variable1,Variable2,Variable3" class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 variables">
                  </div>
                </div>
              </div>
              <button type="button" onclick="addFunction()" class="add-function rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:ring-gray-400">Add function</button>
            </div>

          </div>
        
          <div class="module-form-buttons mt-6 flex items-center justify-end gap-x-6">
            <button type="button" onclick="hideCreateModuleOverlay()" class="text-sm font-semibold leading-6 text-gray-900">Cancel</button>
            <button type="submit" onclick="createModule()" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Save</button>
          </div>
        </form>
  

      </div>
    </div>
  </div>
